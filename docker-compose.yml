services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-teamc_isow}
      POSTGRES_USER: ${DB_USER:-teamc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-teamc_password}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
