spring.application.name=backend

# リポジトリ直下の .env を読み込む（backend/ から起動する前提）。.env が無い環境ではスキップする
# OS の環境変数が設定されている場合は、そちらが優先される
spring.config.import=optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# データベース接続情報（値は環境変数で管理。既定値は docker-compose のローカル設定と一致させている）
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teamc_isow}
spring.datasource.username=${DB_USER:teamc}
spring.datasource.password=${DB_PASSWORD:teamc_password}

# 開発中はエンティティからテーブルを自動作成・更新する（本番では使用しない）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# フロントエンド（Vite dev server）からのアクセスを許可するオリジン
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# JWT（秘密鍵は環境変数 JWT_SECRET で渡す。既定値は置かない）
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=24h
