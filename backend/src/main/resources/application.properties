spring.application.name=backend

# リポジトリ直下の .env を読み込む（backend/ から起動する前提）。.env が無い環境ではスキップする
# OS の環境変数が設定されている場合は、そちらが優先される
spring.config.import=optional:file:../.env[.properties]

server.port=${SERVER_PORT:8080}

# データベース接続情報（値は環境変数で管理。既定値は docker-compose のローカル設定と一致させている）
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:teamc_isow}
spring.datasource.username=${DB_USER:teamc}
spring.datasource.password=${DB_PASSWORD:teamc_password}

# 開発中はエンティティからテーブルを自動作成・更新する（本番では使用しない）
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# 一覧で関連（投稿の画像・タグなど）を1件ずつ読む SQL が件数分発行されないよう、IN (...) でまとめて読む
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# フロントエンド（Vite dev server）からのアクセスを許可するオリジン
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# 画像の保存先。local はサーバーのローカルフォルダ（開発用）。公開時はクラウドストレージ（R2 など）の実装に差し替える
app.image.storage=${IMAGE_STORAGE:local}
# 1ファイルあたりのサイズ上限
app.image.max-file-size=10MB
# local の場合の保存先フォルダ（backend/ から起動した場合は backend/uploads。.gitignore 済み）
app.image.local.dir=${IMAGE_LOCAL_DIR:./uploads}
# local の場合に、ブラウザから画像を表示する URL の先頭部分（/uploads/** で配信する）
app.image.local.public-base-url=${IMAGE_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8080}/uploads}

# アップロードの上限（投稿作成は写真と投稿内容を multipart で一度に受け取る）
# 1ファイルは画像のサイズ上限と同じ。リクエスト全体は 10MB × 10枚 ＋ 文字の分の余裕
spring.servlet.multipart.max-file-size=${app.image.max-file-size}
spring.servlet.multipart.max-request-size=110MB

# JWT（秘密鍵は環境変数 JWT_SECRET で渡す。既定値は置かない）
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=24h

# 1人が受けられる「進行中」の相談の上限（自分から申し込んだ会話と、申請中の会話は数えない。docs/dm.md）
app.dm.max-received-active-conversations=${DM_MAX_RECEIVED_ACTIVE_CONVERSATIONS:3}

# 起動時に管理者にする登録済みユーザーのメールアドレス（docs/admin.md「管理者アカウントの用意」）。空なら何もしない
app.admin.email=${ADMIN_EMAIL:}
