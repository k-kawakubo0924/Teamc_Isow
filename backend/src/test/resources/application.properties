# テスト用の設定。src/main/resources/application.properties の代わりに読み込まれる。
# 環境変数や開発用の PostgreSQL には一切依存しない。

spring.application.name=backend

# H2 のインメモリDB（テストごとに作り直され、終了時に消える）
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

app.cors.allowed-origin=http://localhost:5173

# 画像はビルド用フォルダ（target/）の下に保存する（mvnw clean で消える）
app.image.storage=local
app.image.max-file-size=10MB
app.image.local.dir=target/test-uploads
app.image.local.public-base-url=http://localhost/uploads

# テスト専用の鍵（"test-only-jwt-secret-do-not-use-in-production" を Base64 にしたもの）。本番では使わない
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtZG8tbm90LXVzZS1pbi1wcm9kdWN0aW9u
app.jwt.expiration=24h
